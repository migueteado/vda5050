<!DOCTYPE html>
<html>
<head>
  <title>VDA 5050 viewer</title>
  <style>
    body { font-family: sans-serif; display: flex; gap: 20px; }
    #robots { display: flex; flex-direction: column; gap: 4px; max-width: 320px; }
    .robot-row {
      display: flex; justify-content: space-between;
      padding: 6px 10px; border-radius: 4px; color: white;
    }
    #graph { border: 1px solid #ccc; background: #fafafa; }
    #controls { display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
    textarea { width: 100%; height: 300px; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div>
    <h1>viewer</h1>
    <div id="robots"></div>
    <canvas id="graph" width="600" height="400"></canvas>
  </div>
  <div id="controls">
    <h2>Send order</h2>
    <textarea id="orderJson" placeholder="paste order JSON"></textarea>
    <button id="sendOrder">Send Order</button>
    <div id="sendStatus"></div>
  </div>

  <script>
    const COLORS = {
      ONLINE: "#2e7d32",
      OFFLINE: "#757575",
      HIBERNATING: "#f9a825",
      CONNECTION_BROKEN: "#c62828",
    };

    const rows = new Map();
    const robotsEl = document.getElementById("robots");

    function rowId(msg) {
      return `${msg.manufacturer}/${msg.serialNumber}`;
    }

    function renderConnection(msg) {
      const id = rowId(msg);
      let row = rows.get(id);
      if (!row) {
        row = document.createElement("div");
        row.className = "robot-row";
        rows.set(id, row);
        robotsEl.appendChild(row);
      }
      row.textContent = `${id} — ${msg.connectionState}`;
      row.style.backgroundColor = COLORS[msg.connectionState] || "#000";
    }

    // Graph drawing — nodes/edges come from whatever order was last sent
    // from this browser tab, since the robot doesn't echo the graph back.
    const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");
    const SCALE = 40; // px per metre
    const ORIGIN = { x: 40, y: canvas.height - 40 };

    let currentOrder = null;
    let robotPos = null;

    function toCanvas(x, y) {
      return { x: ORIGIN.x + x * SCALE, y: ORIGIN.y - y * SCALE };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!currentOrder) return;

      const nodeById = new Map(currentOrder.nodes.map((n) => [n.nodeId, n]));

      ctx.strokeStyle = "#888";
      ctx.lineWidth = 2;
      for (const edge of currentOrder.edges) {
        const a = nodeById.get(edge.startNodeId);
        const b = nodeById.get(edge.endNodeId);
        if (!a || !b) continue;
        const pa = toCanvas(a.nodePosition.x, a.nodePosition.y);
        const pb = toCanvas(b.nodePosition.x, b.nodePosition.y);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }

      ctx.fillStyle = "#1565c0";
      ctx.font = "12px sans-serif";
      for (const node of currentOrder.nodes) {
        const p = toCanvas(node.nodePosition.x, node.nodePosition.y);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillText(node.nodeId, p.x + 8, p.y - 8);
      }

      if (robotPos) {
        const p = toCanvas(robotPos.x, robotPos.y);
        ctx.fillStyle = "#c62828";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => console.log("connected");
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if ("connectionState" in msg) {
        renderConnection(msg);
      } else if ("agvPosition" in msg) {
        robotPos = msg.agvPosition;
        draw();
      }
    };

    document.getElementById("sendOrder").onclick = async () => {
      const statusEl = document.getElementById("sendStatus");
      let order;
      try {
        order = JSON.parse(document.getElementById("orderJson").value);
      } catch (e) {
        statusEl.textContent = `invalid JSON: ${e.message}`;
        return;
      }

      currentOrder = order;
      robotPos = null;
      draw();

      const res = await fetch(
        `/order/${order.manufacturer}/${order.serialNumber}`,
        { method: "POST", body: JSON.stringify(order) }
      );
      statusEl.textContent = res.ok
        ? "order sent"
        : `error: ${res.status} ${await res.text()}`;
    };
  </script>
</body>
</html>
